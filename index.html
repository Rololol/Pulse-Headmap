<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07100f">
<title>PULSE — World Monitor</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/pulse.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="signal"></span>PULSE <em>WORLD MONITOR</em></div>
    <div class="search"><span>⌕</span><input id="search" placeholder="Search country, city or event…" autocomplete="off"></div>
    <div class="top-actions"><button id="locate" class="icon-btn" title="World view">◎</button><span class="live"><i></i> LIVE</span><button id="menu" class="icon-btn">☰</button></div>
  </header>

  <main id="map"></main>

  <aside class="left-panel glass">
    <div class="panel-title">LAYERS <span id="layerCount">6</span></div>
    <button class="layer active" data-layer="all"><i class="dot all"></i><span>Overview</span></button>
    <button class="layer" data-layer="conflicts"><i class="dot conflict"></i><span>Conflicts</span><b>12</b></button>
    <button class="layer" data-layer="earthquakes"><i class="dot quake"></i><span>Earthquakes</span><b id="quakeCount">—</b></button>
    <button class="layer" data-layer="weather"><i class="dot weather"></i><span>Severe weather</span></button>
    <button class="layer" data-layer="wildfires"><i class="dot fire"></i><span>Wildfires</span></button>
    <button class="layer" data-layer="outages"><i class="dot outage"></i><span>Outages</span></button>
    <button class="layer" data-layer="infrastructure"><i class="dot infra"></i><span>Infrastructure</span></button>
    <div class="panel-divider"></div>
    <div class="panel-title small">REGION</div>
    <div class="regions">
      <button data-view="world" class="active">WORLD</button><button data-view="eu">EUROPE</button>
      <button data-view="mena">MENA</button><button data-view="asia">ASIA</button>
      <button data-view="americas">AMERICAS</button><button data-view="africa">AFRICA</button>
    </div>
  </aside>

  <section class="right-panel">
    <div class="glass overview">
      <div class="panel-title">GLOBAL PICTURE <span id="updated">UPDATING</span></div>
      <div class="metrics">
        <div><strong id="activeEvents">—</strong><span>signals</span></div>
        <div><strong id="quakes">—</strong><span>earthquakes</span></div>
        <div><strong id="hotspots">—</strong><span>hotspots</span></div>
      </div>
    </div>
    <div id="inspector" class="glass inspector hidden">
      <div class="panel-title">EVENT <button id="closeInspector">×</button></div>
      <div id="inspectorBody"></div>
    </div>
  </section>

  <section class="bottom-bar glass">
    <div class="range-tabs">
      <button data-range="1h">1H</button><button data-range="6h">6H</button><button data-range="24h" class="active">24H</button><button data-range="7d">7D</button><button data-range="30d">30D</button>
    </div>
    <div class="timeline"><span>-30d</span><input id="time" type="range" min="0" max="30" value="30"><span>NOW</span></div>
    <div class="coords mono" id="coords">20.0°N 0.0°E · Z2</div>
  </section>

  <div id="mobileSheet" class="mobile-sheet glass">
    <div class="sheet-grip"></div>
    <div class="panel-title">LAYERS <button id="closeMenu">×</button></div>
    <div class="mobile-layers">
      <button class="layer active" data-layer="all"><i class="dot all"></i>Overview</button>
      <button class="layer" data-layer="conflicts"><i class="dot conflict"></i>Conflicts</button>
      <button class="layer" data-layer="earthquakes"><i class="dot quake"></i>Earthquakes</button>
      <button class="layer" data-layer="weather"><i class="dot weather"></i>Weather</button>
      <button class="layer" data-layer="wildfires"><i class="dot fire"></i>Wildfires</button>
      <button class="layer" data-layer="outages"><i class="dot outage"></i>Outages</button>
    </div>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
