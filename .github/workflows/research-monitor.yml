name: PULSE research monitor
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check Bundestag RSS sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pulse
          curl -fsSL "https://www.bundestag.de/static/appdata/includes/rss/hib.rss" -o /tmp/pulse/hib.rss
          curl -fsSL "https://www.bundestag.de/static/appdata/includes/rss/drucksachen.rss" -o /tmp/pulse/drucksachen.rss
          curl -fsSL "https://www.bundestag.de/static/appdata/includes/rss/presse.rss" -o /tmp/pulse/presse.rss || true
          cat /tmp/pulse/*.rss > /tmp/pulse/all.txt
          if grep -Eiq "Untersuchungsausschuss|Bundesrechnungshof|Fehlbetrag|Schaden|Mehrkosten|Fehlinvestition|Rückforderung|Steuerausfall|Aufsicht|Beschaffung|Korruption|Vergabe|Subvention|Gericht|Urteil|Beschluss|Verfassungsbeschwer|Kosten|Haushalt|Schulden|Vorteilsannahme|Pflichtverletzung" /tmp/pulse/all.txt; then
            gh issue create --title "PULSE research inbox: neue amtliche Treffer" --body-file /tmp/pulse/all.txt --label "research" || gh issue create --title "PULSE research inbox: neue amtliche Treffer" --body-file /tmp/pulse/all.txt
          else
            echo "Keine Treffer mit den aktuellen Suchbegriffen."
          fi
      - name: Check courts and official finance sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for pair in \
            "bverfg|https://www.bundesverfassungsgericht.de/SharedDocs/Pressemitteilungen/DE/" \
            "bverwg|https://www.bverwg.de/aktuelles" \
            "bgh|https://www.bundesgerichtshof.de/SiteGlobals/Forms/Suche/Expertensuche_Formular.html?documentType_=pressrelease%20imgobject%20prdocument&sortOrder=dateOfIssue_dt%20desc"; do
            name="${pair%%|*}"; url="${pair#*|}"; curl -fsSL "$url" -o "/tmp/pulse/$name.html" || true
            if test -s "/tmp/pulse/$name.html" && grep -Eiq "Urteil|Beschluss|Entscheidung|Verhandlung|Vorteilsannahme|Durchsuchung|Verfahren" "/tmp/pulse/$name.html"; then
              gh issue create --title "PULSE research inbox: $name official hits" --body-file "/tmp/pulse/$name.html" --label "research" || gh issue create --title "PULSE research inbox: $name official hits" --body-file "/tmp/pulse/$name.html"
            fi
          done
      - name: Check Bundesrechnungshof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL "https://bundesrechnungshof.de/veroeffentlichungen/berichtssuche" -o /tmp/pulse/brh.html
          if grep -Eiq "Fehlinvest|Mehrkosten|Millionen|Milliarden|nicht wirtschaftlich|Mittel nicht wirksam|Steuerausfall" /tmp/pulse/brh.html; then
            gh issue create --title "PULSE research inbox: Bundesrechnungshof Treffer" --body-file /tmp/pulse/brh.html --label "research" || gh issue create --title "PULSE research inbox: Bundesrechnungshof Treffer" --body-file /tmp/pulse/brh.html
          fi
