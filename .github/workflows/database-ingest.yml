name: PULSE source ingestion

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch new official publications
        run: python3 scripts/ingest.py
      - name: Commit source inbox
        run: |
          git config user.name "pulse-bot"
          git config user.email "41898282+pulse-bot@users.noreply.github.com"
          git add data/inbox.json
          if git diff --cached --quiet; then
            echo "No new publications."
          else
            git commit -m "Update official source inbox"
            git push
          fi
